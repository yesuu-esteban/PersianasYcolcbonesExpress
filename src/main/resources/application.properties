# ── Servidor ──
server.port=${PORT:8081}
server.forward-headers-strategy=framework

# ── Base de datos ──
# Los valores reales van como variables de entorno (en Railway y en tu PC).
# Lo que va después de ":" es el valor por defecto si la variable no existe.
spring.datasource.url=${DB_URL:jdbc:postgresql://thomas.proxy.rlwy.net:49013/railway}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# ── Errores: no mostrar detalles técnicos al público ──
server.error.include-stacktrace=never
server.error.include-message=always

# ── Logs (activa DEBUG solo si necesitas revisar el SQL) ──
logging.level.org.hibernate.SQL=INFO

# ── Reportes de fábrica ──
reportes.carpeta=./reportes

# ── Enlace de recuperación de contraseña (local o producción) ──
app.base-url=${APP_BASE_URL:http://localhost:8081}

# ── Tienda virtual ──
tienda.whatsapp=${TIENDA_WHATSAPP:573041354963}
tienda.telefonos=304 135 4963, 312 206 5950, 314 866 0215
app.dominio-tienda=${APP_DOMINIO_TIENDA:}

# ── Wompi (vacío hasta que la empresa tenga su cuenta) ──
wompi.public-key=${WOMPI_PUBLIC_KEY:}
wompi.integrity-secret=${WOMPI_INTEGRITY_SECRET:}
wompi.events-secret=${WOMPI_EVENTS_SECRET:}

# ── Fotos de productos de hasta 5 MB ──
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB