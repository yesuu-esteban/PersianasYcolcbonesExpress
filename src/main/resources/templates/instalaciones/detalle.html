<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea personal - Persianas Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/instalaciones/detalle.css">
</head>
<body>
<div class="contenedor">
    <a href="/instalaciones" class="volver">← Volver a Instalaciones</a>

    <div class="caja" th:style="'--c:' + ${tarea.color}">
        <div class="tipo" th:text="${tarea.tipoEtiqueta} + ' personal'"></div>
        <h1 th:text="${tarea.tituloMostrado}"></h1>
        <div class="cuando" th:text="${tarea.fechaLarga} + ', ' + ${tarea.horaRango}"></div>
        <span class="chip chip-estado" th:text="${tarea.estadoEtiqueta}"></span>
        <span class="chip chip-gris" th:text="'De ' + ${tarea.nombresInstaladores}"></span>

        <div class="aviso">
            🔒 Esta es una tarea <strong>personal</strong> que agregó
            <strong th:text="${tarea.nombresInstaladores}"></strong>. Solo él la puede modificar o eliminar.
            Mientras exista, ese horario está ocupado y no se le puede asignar otra tarea encima.
        </div>

        <dl>
            <dt th:if="${tarea.cliente != null and tarea.cliente != ''}">Cliente</dt>
            <dd th:if="${tarea.cliente != null and tarea.cliente != ''}" th:text="${tarea.cliente}"></dd>
            <dt th:if="${tarea.telefono != null and tarea.telefono != ''}">Teléfono</dt>
            <dd th:if="${tarea.telefono != null and tarea.telefono != ''}" th:text="${tarea.telefono}"></dd>
            <dt th:if="${tarea.direccion != null and tarea.direccion != ''}" th:text="${tarea.tipo == 'OTRO'} ? 'Lugar' : 'Dirección'">Dirección</dt>
            <dd th:if="${tarea.direccion != null and tarea.direccion != ''}" th:text="${tarea.direccion}"></dd>
            <dt th:if="${tarea.titulo != null and tarea.titulo != '' and tarea.tipo != 'OTRO'}">Asunto</dt>
            <dd th:if="${tarea.titulo != null and tarea.titulo != '' and tarea.tipo != 'OTRO'}" th:text="${tarea.titulo}"></dd>
            <dt th:if="${tarea.notas != null and tarea.notas != ''}">Notas</dt>
            <dd th:if="${tarea.notas != null and tarea.notas != ''}" th:text="${tarea.notas}"></dd>
            <dt th:if="${tarea.observacionesInstalador != null and tarea.observacionesInstalador != ''}">Al terminar</dt>
            <dd th:if="${tarea.observacionesInstalador != null and tarea.observacionesInstalador != ''}" th:text="${tarea.observacionesInstalador}"></dd>
        </dl>
    </div>
</div>
<script src="/js/token-nav.js"></script>
</body>
</html>
