<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarea personal - Persianas Express</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root { --bg-card: #2a1b42; --accent: #ec1561; --texto: #f4f0fb; --texto-suave: #cbb8e0; }
        * { font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(160deg, #1a0f2e 0%, #241536 100%); color: #fff; padding: 24px; min-height: 100vh; }
        .contenedor { max-width: 640px; margin: 0 auto; }
        .volver { color: var(--texto-suave); text-decoration: none; font-size: 0.88rem; }
        .volver:hover { color: #fff; }
        .caja { background: var(--bg-card); border-radius: 14px; padding: 22px; margin-top: 14px; box-shadow: 0 4px 22px rgba(0,0,0,0.3); border-left: 6px solid var(--c); }
        .tipo { font-size: 0.8rem; font-weight: 700; color: var(--c); filter: brightness(1.4); }
        h1 { font-size: 1.4rem; font-weight: 800; margin: 2px 0 6px; }
        .cuando { color: var(--texto-suave); font-size: 0.92rem; }
        .chip { display: inline-block; font-size: 0.74rem; font-weight: 600; padding: 3px 10px; border-radius: 20px; margin: 10px 4px 0 0; }
        .chip-estado { background: var(--c); color: #fff; }
        .chip-gris { background: rgba(255,255,255,0.12); color: var(--texto); }
        .aviso { background: rgba(255,255,255,0.06); border: 1px dashed rgba(255,255,255,0.45); border-radius: 12px; padding: 12px 14px; font-size: 0.88rem; margin-top: 14px; }
        dl { display: grid; grid-template-columns: 100px 1fr; gap: 6px 10px; margin: 16px 0 0; font-size: 0.9rem; }
        dt { color: var(--texto-suave); font-weight: 600; }
        dd { margin: 0; word-break: break-word; white-space: pre-line; }
    </style>
</head>
<body>
<div class="contenedor">
    <a href="/instalaciones" class="volver">← Volver a Instalaciones</a>

    <div class="caja" th:style="'--c:' + ${tarea.color}">
        <div class="tipo" th:text="${tarea.tipoEtiqueta} + ' personal'"></div>
        <h1 th:text="${tarea.tituloMostrado}"></h1>
        <div class="cuando" th:text="${tarea.fechaLarga} + ', ' + ${tarea.horaRango}"></div>
        <span class="chip chip-estado" th:text="${tarea.estadoEtiqueta}"></span>
        <span class="chip chip-gris" th:text="'De ' + ${tarea.nombresInstaladores}"></span>

        <div class="aviso">
            🔒 Esta es una tarea <strong>personal</strong> que agregó
            <strong th:text="${tarea.nombresInstaladores}"></strong>. Solo él la puede modificar o eliminar.
            Mientras exista, ese horario está ocupado y no se le puede asignar otra tarea encima.
        </div>

        <dl>
            <dt th:if="${tarea.cliente != null and tarea.cliente != ''}">Cliente</dt>
            <dd th:if="${tarea.cliente != null and tarea.cliente != ''}" th:text="${tarea.cliente}"></dd>
            <dt th:if="${tarea.telefono != null and tarea.telefono != ''}">Teléfono</dt>
            <dd th:if="${tarea.telefono != null and tarea.telefono != ''}" th:text="${tarea.telefono}"></dd>
            <dt th:if="${tarea.direccion != null and tarea.direccion != ''}" th:text="${tarea.tipo == 'OTRO'} ? 'Lugar' : 'Dirección'">Dirección</dt>
            <dd th:if="${tarea.direccion != null and tarea.direccion != ''}" th:text="${tarea.direccion}"></dd>
            <dt th:if="${tarea.titulo != null and tarea.titulo != '' and tarea.tipo != 'OTRO'}">Asunto</dt>
            <dd th:if="${tarea.titulo != null and tarea.titulo != '' and tarea.tipo != 'OTRO'}" th:text="${tarea.titulo}"></dd>
            <dt th:if="${tarea.notas != null and tarea.notas != ''}">Notas</dt>
            <dd th:if="${tarea.notas != null and tarea.notas != ''}" th:text="${tarea.notas}"></dd>
            <dt th:if="${tarea.observacionesInstalador != null and tarea.observacionesInstalador != ''}">Al terminar</dt>
            <dd th:if="${tarea.observacionesInstalador != null and tarea.observacionesInstalador != ''}" th:text="${tarea.observacionesInstalador}"></dd>
        </dl>
    </div>
</div>
<script src="/js/token-nav.js"></script>
</body>
</html>
