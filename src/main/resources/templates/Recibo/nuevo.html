<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Nuevo Recibo de Caja</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#f4f4f9; padding:24px; }
        .container-recibo { max-width:700px; margin:0 auto; background:#fff; padding:24px; border-radius:8px; border:1px solid #ddd; }
        .fila-producto-form { display:flex; gap:8px; margin-bottom:8px; align-items:center; }
        .fila-producto-form input { flex:1; }
        .fila-producto-form .col-precio, .fila-producto-form .col-cant { max-width:110px; }
    </style>
</head>
<body>
<div class="container-recibo">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h3>🧾 Nuevo Recibo de Caja</h3>
        <a href="/recibos" class="btn btn-outline-secondary btn-sm">← Ver listado</a>
    </div>
    <p class="text-muted" style="font-size:0.85rem;">
        Este recibo quedará registrado como origen <strong th:text="${origenSugerido}"></strong> (según tu usuario).
    </p>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form th:action="@{/recibos/guardar}" method="post" id="formRecibo">
        <fieldset class="mb-3 border rounded p-3">
            <legend class="fw-bold" style="font-size:1rem;">Datos del Cliente</legend>
            <div class="mb-2">
                <label class="form-label">Cliente</label>
                <input type="text" name="cliente" class="form-control" required>
            </div>
            <div class="mb-2">
                <label class="form-label">Dirección</label>
                <input type="text" name="direccion" class="form-control">
            </div>
            <div class="row g-2">
                <div class="col-6">
                    <label class="form-label">Cédula</label>
                    <input type="text" name="cedula" class="form-control">
                </div>
                <div class="col-6">
                    <label class="form-label">Teléfono</label>
                    <input type="tel" name="telefono" class="form-control">
                </div>
            </div>
        </fieldset>

        <fieldset class="mb-3 border rounded p-3">
            <legend class="fw-bold" style="font-size:1rem;">Productos</legend>
            <div id="contenedorProductos">
                <div class="fila-producto-form">
                    <input type="text" name="nombresProducto" class="form-control" placeholder="Producto" required>
                    <input type="number" name="precios" step="0.01" min="0.01" class="form-control col-precio" placeholder="Precio" required>
                    <input type="number" name="cantidades" min="1" value="1" class="form-control col-cant" placeholder="Cant.">
                    <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.fila-producto-form').remove(); recalcular();">✕</button>
                </div>
            </div>
            <button type="button" class="btn btn-sm btn-outline-dark mt-2" onclick="agregarFila()">+ Añadir Producto</button>
        </fieldset>

        <div class="mb-3">
            <p><strong>Total General: $<span id="lblTotal">0.00</span></strong></p>
            <label class="form-label">Abono</label>
            <input type="number" name="abono" id="inputAbono" step="0.01" min="0" value="0" class="form-control" style="max-width:200px;">
        </div>

        <button type="submit" class="btn btn-success w-100">Generar Recibo</button>
    </form>
</div>

<script>
    function agregarFila() {
        const cont = document.getElementById('contenedorProductos');
        const div = document.createElement('div');
        div.className = 'fila-producto-form';
        div.innerHTML = `
            <input type="text" name="nombresProducto" class="form-control" placeholder="Producto" required>
            <input type="number" name="precios" step="0.01" min="0.01" class="form-control col-precio" placeholder="Precio" required>
            <input type="number" name="cantidades" min="1" value="1" class="form-control col-cant" placeholder="Cant.">
            <button type="button" class="btn btn-sm btn-outline-danger" onclick="this.closest('.fila-producto-form').remove(); recalcular();">✕</button>
        `;
        cont.appendChild(div);
        engancharRecalculo(div);
    }

    function recalcular() {
        let total = 0;
        document.querySelectorAll('.fila-producto-form').forEach(fila => {
            const precio = parseFloat(fila.querySelector('input[name="precios"]').value) || 0;
            const cantidad = parseFloat(fila.querySelector('input[name="cantidades"]').value) || 0;
            total += precio * cantidad;
        });
        document.getElementById('lblTotal').textContent = total.toFixed(2);
    }

    function engancharRecalculo(fila) {
        fila.querySelectorAll('input[name="precios"], input[name="cantidades"]').forEach(input => {
            input.addEventListener('input', recalcular);
        });
    }

    document.querySelectorAll('.fila-producto-form').forEach(engancharRecalculo);
    recalcular();
</script>
<script src="/js/token-nav.js"></script>
</body>
</html>
