<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:replace="~{fragments/sidebar :: layout(contenido=~{::seccion-contenido}, activo='pedidos-fabrica', titulo='✏️ Editar Riel de Onda Serena')}">

<div th:fragment="seccion-contenido">
    <link rel="stylesheet" href="/css/fabrica/editar_pedido_riel.css">

    <div class="row justify-content-center">
        <div class="col-md-8">
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

            <form th:action="@{/taller/editar-riel/{id}(id=${pedido.id})}" method="post"
                  class="bg-white p-4 shadow-sm border rounded">

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Distribuidor</label>
                        <input type="text" name="nombreDecorador" class="form-control" th:value="${pedido.nombreDecorador}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Cliente Final</label>
                        <input type="text" name="nombreClienteFinal" class="form-control" th:value="${pedido.nombreClienteFinal}" required>
                    </div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-bold">Descripción</label>
                    <input type="text" name="descripcion" class="form-control" th:value="${pedido.descripcion}">
                </div>

                <div class="row g-3 mb-3">
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Ancho (m)</label>
                        <input type="number" step="0.001" name="ancho" id="campoAncho"
                               class="form-control" th:value="${pedido.ancho}" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label fw-bold">Alto (m)</label>
                        <input type="number" step="0.001" name="altura" id="campoAltura"
                               class="form-control" th:value="${pedido.altura}" placeholder="opcional">
                    </div>
                </div>

                <div class="seccion-manual mb-3">
                    <div class="form-check mb-2">
                        <input type="checkbox" name="usaPolea" value="true" id="ckUsaPolea" class="form-check-input"
                               th:checked="${pedido.usaPolea}">
                        <label for="ckUsaPolea" class="form-check-label">⚙ Lleva polea</label>
                    </div>

                    <div class="row g-2 mt-2">
                        <div class="col-md-6" id="filaBastonRiel">
                            <label class="form-label fw-bold">Bastón</label>
                            <select name="bastonElegido" class="form-select">
                                <option value="Bastón 0.80" th:selected="${pedido.bastonElegido == 'Bastón 0.80'}">Bastón 0.80</option>
                                <option value="Bastón 1.20" th:selected="${pedido.bastonElegido == 'Bastón 1.20'}">Bastón 1.20</option>
                                <option value="Bastón 1.50" th:selected="${pedido.bastonElegido == 'Bastón 1.50'}">Bastón 1.50</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold">Abre hacia</label>
                            <select name="ladoApertura" id="selectLadoApertura" class="form-select">
                                <option value="Izquierda" th:selected="${pedido.ladoApertura == 'Izquierda'}">Izquierda</option>
                                <option value="Derecha" th:selected="${pedido.ladoApertura == 'Derecha'}">Derecha</option>
                                <option value="Hacia los extremos" th:selected="${pedido.ladoApertura == 'Hacia los extremos'}">Hacia los extremos</option>
                            </select>
                        </div>
                    </div>

                    <div id="cajaPrevisualizacion" class="previsualizacion">
                        <span class="cargando">Cargando...</span>
                    </div>
                </div>

                <div class="seccion-extras">
                    <p class="fw-bold mb-2">➕ Insumos adicionales del riel (opcional)</p>
                    <p class="text-muted mb-2" style="font-size:0.82rem;">
                        Los accesorios obligatorios (poleas/crusador, o tapas/bastón, riata, soportes según corresponda)
                        ya se calculan y descuentan automáticamente. Usa esto solo para material extra fuera de lo normal.
                    </p>
                    <div id="contenedorExtras"></div>
                    <button type="button" class="btn btn-sm btn-outline-dark mt-1" onclick="agregarFilaExtra()">+ Agregar insumo extra</button>
                </div>

                <div class="mt-4">
                    <button type="submit" class="btn btn-primary w-100">Guardar Cambios</button>
                    <a href="/taller/pedidos" class="btn btn-secondary w-100 mt-2">Cancelar</a>
                </div>
            </form>
        </div>
    </div>

<script th:inline="javascript">
    /*<![CDATA[*/
    const piezasDisponibles = /*[[${piezasDisponibles}]]*/ [];
    const catalogoInsumos   = /*[[${catalogoInsumos}]]*/   [];
    const extrasExistentes  = /*[[${extrasExistentes}]]*/  [];
    /*]]>*/
</script>

<script src="/js/fabrica/editar_pedido_riel.js"></script>
</div>

</div>

</body>
</html>
