<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Usuario</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --carbon: #121110; --carbon-light: #1c1a18; --carbon-card: #181614;
            --cream: #F4EFE6; --cream-muted: #b8b2a7; --brass: #C5A059; --brass-hover: #d6b26d;
            --border-color: rgba(244, 239, 230, 0.08); --danger: #e05a5a; --success: #6fbf73;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--carbon); color: var(--cream); min-height: 100vh; padding: 40px 24px; }
        .contenedor { max-width: 480px; margin: 0 auto; }
        .volver { color: var(--cream-muted); text-decoration: none; font-size: 0.85rem; }
        .volver:hover { color: var(--brass); }
        h1 { font-size: 1.4rem; font-weight: 600; margin: 14px 0 22px; }
        .tarjeta { background: var(--carbon-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 26px; }
        .campo { margin-bottom: 16px; }
        label { display: block; font-size: 0.82rem; color: var(--cream-muted); margin-bottom: 6px; }
        input, select {
            width: 100%; padding: 10px 12px; background: var(--carbon-light);
            border: 1px solid var(--border-color); border-radius: 6px; color: var(--cream); font-size: 0.9rem;
        }
        input:focus, select:focus { outline: none; border-color: var(--brass); }
        .btn {
            display: inline-block; width: 100%; padding: 11px; border-radius: 6px; border: none;
            background: var(--brass); color: var(--carbon); font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 6px;
        }
        .btn:hover { background: var(--brass-hover); }
        .alerta { padding: 12px 16px; border-radius: 6px; margin-bottom: 18px; font-size: 0.9rem; }
        .alerta-error { background: rgba(224,90,90,0.12); border: 1px solid var(--danger); color: #ffb3b3; }
        small.ayuda { display: block; color: var(--cream-muted); font-size: 0.75rem; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <a class="volver" href="/usuarios">&larr; Volver a usuarios</a>
        <h1>+ Nuevo usuario</h1>

        <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

        <div class="tarjeta">
            <form th:action="@{/usuarios/nuevo}" method="post">
                <div class="campo">
                    <label>Usuario (para iniciar sesión)</label>
                    <input type="text" name="username" required autocomplete="off">
                </div>
                <div class="campo">
                    <label>Nombre completo (opcional)</label>
                    <input type="text" name="nombreCompleto">
                </div>
                <div class="campo">
                    <label>Correo (opcional)</label>
                    <input type="email" name="email" placeholder="usuario@correo.com">
                    <small class="ayuda">Sin correo, este usuario no podrá usar "¿Olvidaste tu contraseña?" y necesitará que un ADMIN se la resetee manualmente.</small>
                </div>
                <div class="campo">
                    <label>Rol</label>
                    <select name="rol" required>
                        <option value="" disabled selected>Selecciona un rol</option>
                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                    </select>
                </div>
                <div class="campo">
                    <label>Contraseña</label>
                    <input type="password" name="password" required minlength="6">
                    <small class="ayuda">Mínimo 6 caracteres.</small>
                </div>
                <div class="campo">
                    <label>Confirmar contraseña</label>
                    <input type="password" name="confirmarPassword" required minlength="6">
                </div>
                <button type="submit" class="btn">Crear usuario</button>
            </form>
        </div>
    </div>
</body>
</html>
