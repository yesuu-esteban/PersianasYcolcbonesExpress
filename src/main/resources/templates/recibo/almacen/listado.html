<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Recibos de Almacén</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>🧾 Recibos de Almacén</h2>
        <div class="d-flex gap-2">
            <a href="/portal" class="btn btn-outline-secondary">← Portal</a>
            <a href="/almacen/listado" class="btn btn-outline-secondary">🛒 Pedidos de Almacén</a>
            <a href="/recibos/almacen/nuevo" class="btn btn-primary">+ Nuevo Recibo</a>
            <a href="/logout" class="btn btn-outline-danger">🚪 Cerrar sesión</a>
        </div>
    </div>

    <div th:if="${mensaje}" class="alert alert-success" th:text="${mensaje}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <form method="get" th:action="@{/recibos/almacen}" class="row g-2 align-items-end mb-3">
        <div class="col-md-4">
            <label class="form-label">Cliente</label>
            <input type="text" name="cliente" th:value="${cliente}" class="form-control" placeholder="Nombre...">
        </div>
        <div class="col-md-3">
            <label class="form-label">Desde</label>
            <input type="date" name="desde" th:value="${desde}" class="form-control">
        </div>
        <div class="col-md-3">
            <label class="form-label">Hasta</label>
            <input type="date" name="hasta" th:value="${hasta}" class="form-control">
        </div>
        <div class="col-md-2 d-flex gap-2">
            <button type="submit" class="btn btn-outline-primary flex-fill">Filtrar</button>
            <a href="/recibos/almacen" class="btn btn-outline-secondary">✕</a>
        </div>
    </form>

    <div class="table-responsive bg-white rounded shadow-sm p-2">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-dark">
                <tr>
                    <th>#</th><th>Cliente</th><th>Cédula</th><th>Teléfono</th>
                    <th>Fecha</th><th>Total</th><th>Abono</th><th>Saldo</th><th>Firma</th><th>Generado por</th><th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="r : ${recibos}">
                    <td th:text="${r.numeroFormateado}"></td>
                    <td th:text="${r.cliente}"></td>
                    <td th:text="${r.cedula}"></td>
                    <td th:text="${r.telefono}"></td>
                    <td th:text="${r.fechaFormateada}"></td>
                    <td th:text="${#numbers.formatDecimal(r.total, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${#numbers.formatDecimal(r.abono, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td th:text="${#numbers.formatDecimal(r.saldo, 1, 'POINT', 2, 'COMMA')}"></td>
                    <td>
                        <span th:if="${r.isFirmado()}" class="badge bg-success">✍️ Firmado</span>
                        <span th:unless="${r.isFirmado()}" class="badge bg-secondary">Sin firmar</span>
                    </td>
                    <td th:text="${r.creadoPor}"></td>
                    <td>
                        <a th:href="@{/recibos/imprimir/{id}(id=${r.id})}" target="_blank" class="btn btn-sm btn-outline-dark" title="Ver recibo">🖨️</a>
                        <button type="button" class="btn btn-sm btn-outline-success btn-compartir-pdf" title="Compartir recibo"
                                th:data-url="@{/recibos/pdf/{id}(id=${r.id})}"
                                th:data-nombre="'recibo_' + ${r.numeroFormateado} + '.pdf'">📤</button>
                        <form th:action="@{/recibos/eliminar/{id}(id=${r.id})}" method="post" class="d-inline"
                              onsubmit="return confirm('¿Eliminar este recibo?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger">🗑️</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(recibos)}">
                    <td colspan="11" class="text-center text-muted py-3">No hay recibos de almacén registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
<script src="/js/recibo-compartir.js"></script>
<script src="/js/token-nav.js"></script>
</body>
</html>
