<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --carbon: #121110; --carbon-light: #1c1a18; --carbon-card: #181614;
            --cream: #F4EFE6; --cream-muted: #b8b2a7; --brass: #C5A059; --brass-hover: #d6b26d;
            --border-color: rgba(244, 239, 230, 0.08); --danger: #e05a5a; --success: #6fbf73;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--carbon); color: var(--cream); min-height: 100vh; padding: 40px 24px; }
        .contenedor { max-width: 480px; margin: 0 auto; }
        .volver { color: var(--cream-muted); text-decoration: none; font-size: 0.85rem; }
        .volver:hover { color: var(--brass); }
        h1 { font-size: 1.4rem; font-weight: 600; margin: 14px 0 6px; }
        .subtitulo { color: var(--cream-muted); font-size: 0.85rem; margin-bottom: 22px; }
        .subtitulo strong { color: var(--brass); }
        h2 { font-size: 1rem; font-weight: 600; margin: 28px 0 14px; color: var(--brass); }
        .tarjeta { background: var(--carbon-card); border: 1px solid var(--border-color); border-radius: 10px; padding: 26px; }
        .campo { margin-bottom: 16px; }
        label { display: block; font-size: 0.82rem; color: var(--cream-muted); margin-bottom: 6px; }
        input {
            width: 100%; padding: 10px 12px; background: var(--carbon-light);
            border: 1px solid var(--border-color); border-radius: 6px; color: var(--cream); font-size: 0.9rem;
        }
        input:disabled { color: var(--cream-muted); }
        input:focus { outline: none; border-color: var(--brass); }
        .btn {
            display: inline-block; width: 100%; padding: 11px; border-radius: 6px; border: none;
            background: var(--brass); color: var(--carbon); font-weight: 600; font-size: 0.9rem; cursor: pointer; margin-top: 6px;
        }
        .btn:hover { background: var(--brass-hover); }
        .alerta { padding: 12px 16px; border-radius: 6px; margin-bottom: 18px; font-size: 0.9rem; }
        .alerta-ok { background: rgba(111,191,115,0.12); border: 1px solid var(--success); color: #b9f0bd; }
        .alerta-error { background: rgba(224,90,90,0.12); border: 1px solid var(--danger); color: #ffb3b3; }
        small.ayuda { display: block; color: var(--cream-muted); font-size: 0.75rem; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="contenedor">
        <a class="volver" href="/portal">&larr; Volver al portal</a>
        <h1>👤 Mi cuenta</h1>
        <p class="subtitulo">Usuario: <strong th:text="${usuario.username}"></strong> · Rol: <strong th:text="${usuario.rol}"></strong></p>

        <div th:if="${mensaje}" class="alerta alerta-ok" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

        <h2>Información personal</h2>
        <div class="tarjeta">
            <form th:action="@{/mi-cuenta/actualizar}" method="post">
                <div class="campo">
                    <label>Nombre completo</label>
                    <input type="text" name="nombreCompleto" th:value="${usuario.nombreCompleto}">
                </div>
                <button type="submit" class="btn">Guardar información</button>
            </form>
        </div>

        <h2>🔑 Cambiar mi contraseña</h2>
        <div class="tarjeta">
            <form th:action="@{/mi-cuenta/cambiar-password}" method="post">
                <div class="campo">
                    <label>Contraseña actual</label>
                    <input type="password" name="passwordActual" required>
                </div>
                <div class="campo">
                    <label>Nueva contraseña</label>
                    <input type="password" name="nuevaPassword" required minlength="6">
                    <small class="ayuda">Mínimo 6 caracteres.</small>
                </div>
                <div class="campo">
                    <label>Confirmar nueva contraseña</label>
                    <input type="password" name="confirmarPassword" required minlength="6">
                </div>
                <button type="submit" class="btn">Cambiar contraseña</button>
            </form>
        </div>
    </div>
</body>
</html>
