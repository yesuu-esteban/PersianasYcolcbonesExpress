<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#1a0f2e; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family: sans-serif; padding: 20px; }
        .card-login { background:#2a1b42; padding:30px; border-radius:14px; width:360px; }
        .form-control { background:#1e1330; border:1px solid rgba(255,255,255,0.15); color:#fff; }
        .form-control:focus { background:#1e1330; color:#fff; border-color:#ec1561; box-shadow:0 0 0 0.2rem rgba(236,21,97,0.25); }
        .btn-primary { background: linear-gradient(135deg, #ec1561, #b81050); border: none; }
        .volver { color:#cbb8e0; font-size:0.85rem; text-decoration:none; }
        .volver:hover { color:#fff; }
        .alert-danger { background: rgba(231,76,60,0.15); border:1px solid #e74c3c; color:#ff9a90; }
    </style>
</head>
<body>
    <div class="card-login">
        <div th:if="${tokenInvalido}">
            <h4 class="mb-3">Enlace no válido</h4>
            <div class="alert alert-danger">
                Este enlace ya no es válido: puede que haya expirado (dura 30 minutos) o que ya se haya usado.
            </div>
            <a class="btn btn-primary w-100" href="/recuperar-password">Solicitar un nuevo enlace</a>
        </div>

        <div th:unless="${tokenInvalido}">
            <h4 class="mb-3">Crea tu nueva contraseña</h4>
            <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
            <form th:action="@{/recuperar-password/{token}(token=${token})}" method="post">
                <div class="mb-3">
                    <label class="form-label">Nueva contraseña</label>
                    <input type="password" name="nuevaPassword" class="form-control" required minlength="6" autofocus>
                    <small class="text-muted">Mínimo 6 caracteres.</small>
                </div>
                <div class="mb-3">
                    <label class="form-label">Confirmar contraseña</label>
                    <input type="password" name="confirmarPassword" class="form-control" required minlength="6">
                </div>
                <button type="submit" class="btn btn-primary w-100">Guardar nueva contraseña</button>
            </form>
        </div>
    </div>
</body>
</html>
