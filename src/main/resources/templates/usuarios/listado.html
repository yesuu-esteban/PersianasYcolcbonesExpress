<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Usuarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --carbon: #121110; --carbon-light: #1c1a18; --carbon-card: #181614;
            --cream: #F4EFE6; --cream-muted: #b8b2a7; --brass: #C5A059; --brass-hover: #d6b26d;
            --border-color: rgba(244, 239, 230, 0.08); --danger: #e05a5a; --success: #6fbf73;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', system-ui, sans-serif; }
        body { background: var(--carbon); color: var(--cream); min-height: 100vh; padding: 40px 24px; }
        .contenedor { max-width: 1000px; margin: 0 auto; }
        .encabezado { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px; margin-bottom: 24px; }
        h1 { font-size: 1.6rem; font-weight: 600; }
        .volver { color: var(--cream-muted); text-decoration: none; font-size: 0.85rem; }
        .volver:hover { color: var(--brass); }
        .btn {
            display: inline-block; padding: 10px 18px; border-radius: 6px; text-decoration: none;
            font-size: 0.85rem; font-weight: 600; border: 1px solid transparent; cursor: pointer;
        }
        .btn-brass { background: var(--brass); color: var(--carbon); }
        .btn-brass:hover { background: var(--brass-hover); }
        .btn-outline { background: transparent; border-color: var(--border-color); color: var(--cream); }
        .btn-outline:hover { background: rgba(244,239,230,0.06); }
        .btn-danger { background: transparent; border-color: var(--danger); color: var(--danger); }
        .btn-danger:hover { background: var(--danger); color: var(--carbon); }
        .btn-sm { padding: 6px 12px; font-size: 0.78rem; }
        .alerta { padding: 12px 16px; border-radius: 6px; margin-bottom: 18px; font-size: 0.9rem; }
        .alerta-ok { background: rgba(111,191,115,0.12); border: 1px solid var(--success); color: #b9f0bd; }
        .alerta-error { background: rgba(224,90,90,0.12); border: 1px solid var(--danger); color: #ffb3b3; }
        table { width: 100%; border-collapse: collapse; background: var(--carbon-card); border-radius: 8px; overflow: hidden; }
        thead { background: rgba(197,160,89,0.15); }
        th, td { padding: 12px 14px; text-align: left; font-size: 0.85rem; border-bottom: 1px solid var(--border-color); }
        th { color: var(--brass); text-transform: uppercase; font-size: 0.72rem; letter-spacing: 0.06em; }
        tr:last-child td { border-bottom: none; }
        .badge { padding: 3px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 600; }
        .badge-activo { background: rgba(111,191,115,0.15); color: var(--success); }
        .badge-inactivo { background: rgba(224,90,90,0.15); color: var(--danger); }
        .acciones { display: flex; gap: 6px; flex-wrap: wrap; }
        .tu-usuario { color: var(--brass); font-weight: 600; }
        @media (max-width: 700px) {
            table, thead, tbody, th, td, tr { display: block; }
            thead { display: none; }
            tr { margin-bottom: 14px; background: var(--carbon-card); border-radius: 8px; padding: 10px; }
            td { border: none; padding: 6px 8px; }
            td::before { content: attr(data-label); display: block; color: var(--brass); font-size: 0.7rem; text-transform: uppercase; margin-bottom: 2px; }
        }
    </style>
</head>
<body>
    <div class="contenedor">
        <a class="volver" href="/portal">&larr; Volver al portal</a>

        <div class="encabezado" style="margin-top: 14px;">
            <h1>👤 Gestión de Usuarios</h1>
            <a class="btn btn-brass" href="/usuarios/nuevo">+ Nuevo usuario</a>
        </div>

        <div th:if="${mensaje}" class="alerta alerta-ok" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

        <table>
            <thead>
                <tr>
                    <th>Usuario</th>
                    <th>Nombre completo</th>
                    <th>Rol</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="u : ${usuarios}">
                    <td data-label="Usuario">
                        <span th:text="${u.username}"></span>
                        <span th:if="${u.username == usuarioActual}" class="tu-usuario"> (tú)</span>
                    </td>
                    <td data-label="Nombre" th:text="${u.nombreCompleto}"></td>
                    <td data-label="Rol" th:text="${u.rol}"></td>
                    <td data-label="Estado">
                        <span class="badge" th:classappend="${u.activo ? 'badge-activo' : 'badge-inactivo'}"
                              th:text="${u.activo ? 'Activo' : 'Inactivo'}"></span>
                    </td>
                    <td data-label="Acciones">
                        <div class="acciones">
                            <a class="btn btn-outline btn-sm" th:href="@{/usuarios/{id}/editar(id=${u.id})}">Editar</a>
                            <form th:action="@{/usuarios/{id}/eliminar(id=${u.id})}" method="post"
                                  th:if="${u.username != usuarioActual}"
                                  onsubmit="return confirm('¿Eliminar al usuario ' + this.dataset.nombre + '? Esta acción no se puede deshacer.');"
                                  th:data-nombre="${u.username}">
                                <button type="submit" class="btn btn-danger btn-sm">Eliminar</button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(usuarios)}">
                    <td colspan="5" style="text-align:center; color: var(--cream-muted);">No hay usuarios registrados.</td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>
