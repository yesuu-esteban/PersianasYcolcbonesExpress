<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/usuarios/formulario.css">
</head>
<body>
    <div class="contenedor">
        <a class="volver" href="/portal">&larr; Volver al portal</a>
        <h1 class="con-subtitulo">👤 Mi cuenta</h1>
        <p class="subtitulo">Usuario: <strong th:text="${usuario.username}"></strong> · Rol: <strong th:text="${usuario.rol}"></strong></p>

        <div th:if="${mensaje}" class="alerta alerta-ok" th:text="${mensaje}"></div>
        <div th:if="${error}" class="alerta alerta-error" th:text="${error}"></div>

        <h2>Información personal</h2>
        <div class="tarjeta">
            <form th:action="@{/mi-cuenta/actualizar}" method="post">
                <div class="campo">
                    <label>Nombre completo</label>
                    <input type="text" name="nombreCompleto" th:value="${usuario.nombreCompleto}">
                </div>
                <button type="submit" class="btn btn-brass">Guardar información</button>
            </form>
        </div>

        <h2>🔑 Cambiar mi contraseña</h2>
        <div class="tarjeta">
            <form th:action="@{/mi-cuenta/cambiar-password}" method="post">
                <div class="campo">
                    <label>Contraseña actual</label>
                    <input type="password" name="passwordActual" required>
                </div>
                <div class="campo">
                    <label>Nueva contraseña</label>
                    <input type="password" name="nuevaPassword" required minlength="6">
                    <small class="ayuda">Mínimo 6 caracteres.</small>
                </div>
                <div class="campo">
                    <label>Confirmar nueva contraseña</label>
                    <input type="password" name="confirmarPassword" required minlength="6">
                </div>
                <button type="submit" class="btn btn-brass">Cambiar contraseña</button>
            </form>
        </div>
    </div>
    <script src="/js/token-nav.js"></script>
</body>
</html>
