<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tienda-admin/comun.css">

    <title>Tienda virtual - Compras en línea</title>
    <link rel="stylesheet" href="/css/tienda-admin/ordenes.css">
</head>
<body>
<div class="container-fluid" style="max-width:1200px;">
    <div class="marca-header">
        <div class="logo">
            <img src="/tienda/logo.png" alt="">
            <div class="titulo">PERSIANAS EXPRESS<small>TIENDA VIRTUAL</small></div>
        </div>
        <div class="acciones-header">
            <a href="/portal" class="btn btn-outline-secondary">← Portal</a>
            <a href="/tienda-admin" class="btn btn-outline-secondary">Productos</a>
            <a href="/tienda-admin/ordenes" class="btn btn-outline-secondary">Compras en línea</a>
            <a href="/tienda" target="_blank" rel="noopener" class="btn btn-primary">Ver tienda</a>
        </div>
    </div>

    <h1>Compras en línea</h1>
    <p style="color:var(--texto-suave);font-size:.86rem;">Cuando un pago se aprueba, el pedido se crea solo en el listado de Almacén con el vendedor "Tienda virtual" y el abono completo.</p>

    <div class="caja">
        <div th:if="${#lists.isEmpty(ordenes)}" class="text-center py-4" style="color:var(--texto-suave)">Todavía no hay compras en línea.</div>
        <div class="orden" th:each="o : ${ordenes}">
            <div class="fila1">
                <span>
                    <span class="ref" th:text="${o.referencia}"></span>
                    <span class="badge ms-1"
                          th:classappend="${o.estado == 'APROBADA'} ? 'badge-ok' : (${o.estado == 'PENDIENTE'} ? 'badge-pend' : 'badge-mal')"
                          th:text="${o.estadoEtiqueta}"></span>
                </span>
                <span class="total" th:text="'$' + ${#numbers.formatInteger(o.total, 1, 'POINT')}"></span>
            </div>
            <div class="datos">
                <span th:text="${o.fechaCreacionFormateada}"></span> ·
                <span th:text="${o.nombreCliente}"></span> ·
                <a th:href="'tel:' + ${o.telefono}" th:text="${o.telefono}" style="color:inherit"></a> ·
                <span th:text="${o.ciudad} + ', ' + ${o.direccion}"></span>
                <span th:if="${o.metodoPago != null}" th:text="' · ' + ${o.metodoPago}"></span>
            </div>
            <ul>
                <li th:each="it : ${o.items}" th:text="${it.productoNombre} + ' × ' + ${it.cantidad} + ': ' + ${it.detalle}"></li>
            </ul>
            <div class="almacen" th:if="${o.pedidoTiendaId != null}">
                Pedido de Almacén #<span th:text="${o.pedidoTiendaId}"></span> ·
                <a th:href="@{/almacen/imprimir/{id}(id=${o.pedidoTiendaId})}" target="_blank" rel="noopener">Ver pedido</a>
            </div>
            <div class="almacen" th:if="${o.notas != null and o.notas != ''}" th:text="'Notas: ' + ${o.notas}"></div>
        </div>
    </div>
</div>
</body>
</html>
