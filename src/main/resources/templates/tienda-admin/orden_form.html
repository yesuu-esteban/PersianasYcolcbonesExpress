<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/tienda-admin/comun.css">

    <title>Tienda virtual - Editar datos del pedido</title>
    <link rel="stylesheet" href="/css/tienda-admin/orden_form.css">
</head>
<body>
<div class="container-fluid" style="max-width:900px;">
    <div th:replace="~{tienda-admin/fragmentos :: encabezado('pedidos')}"></div>

    <h1>Editar datos del pedido</h1>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- ═══ Lo que se compró (no se edita: viene del pago) ═══ -->
    <div class="caja resumen">
        <div class="resumen-cabeza">
            <span>
                <span class="ref" th:text="${orden.referencia}">PCX000000000000-XXXXX</span>
                <span class="badge"
                      th:classappend="${orden.estado == 'APROBADA'} ? 'badge-ok' : (${orden.estado == 'PENDIENTE'} ? 'badge-pend' : 'badge-mal')"
                      th:text="${orden.estadoEtiqueta}">Pagada</span>
                <span class="badge badge-no" th:if="${orden.pagada}" th:text="${orden.estadoPedidoEtiqueta}">Nuevo</span>
            </span>
            <span class="total" th:text="'$' + ${#numbers.formatInteger(orden.total, 1, 'POINT')}">$0</span>
        </div>
        <ul>
            <li th:each="it : ${orden.items}">
                <strong th:text="${it.productoNombre} + ' × ' + ${it.cantidad}">Producto × 1</strong>
                <span th:if="${it.detalle != ''}" th:text="${it.detalle}">Tela, color, medidas</span>
            </li>
        </ul>
        <p class="ayuda mb-0">Los productos y el total no se pueden cambiar porque vienen del pago. El estado del pedido se cambia en la lista de Pedidos.</p>
    </div>

    <form method="post" th:action="@{/tienda-admin/orden/{id}/guardar(id=${orden.id})}">
        <input type="hidden" name="ver" th:value="${ver}">
        <input type="hidden" name="q" th:value="${q}">
        <input type="hidden" name="pagina" th:value="${pagina}">

        <div class="caja seccion">
            <h2>Datos del cliente</h2>
            <div class="row g-3">
                <div class="col-md-8">
                    <label class="form-label" for="nombre">Nombre completo</label>
                    <input type="text" class="form-control" id="nombre" name="nombre" required maxlength="200"
                           th:value="${datos != null} ? ${datos.get('nombre')} : ${orden.nombreCliente}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="cedula">Cédula</label>
                    <input type="text" class="form-control" id="cedula" name="cedula" inputmode="numeric" required maxlength="30"
                           th:value="${datos != null} ? ${datos.get('cedula')} : ${orden.cedula}">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="telefono">Celular</label>
                    <input type="tel" class="form-control" id="telefono" name="telefono" inputmode="tel" required maxlength="30"
                           th:value="${datos != null} ? ${datos.get('telefono')} : ${orden.telefono}">
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="email">Correo</label>
                    <input type="email" class="form-control" id="email" name="email" required maxlength="200"
                           th:value="${datos != null} ? ${datos.get('email')} : ${orden.email}">
                </div>
            </div>
        </div>

        <div class="caja seccion">
            <h2>Dónde se entrega e instala</h2>
            <div class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="ciudad">Ciudad</label>
                    <input type="text" class="form-control" id="ciudad" name="ciudad" required maxlength="200"
                           th:value="${datos != null} ? ${datos.get('ciudad')} : ${orden.ciudad}">
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="direccion">Dirección</label>
                    <input type="text" class="form-control" id="direccion" name="direccion" required maxlength="250"
                           th:value="${datos != null} ? ${datos.get('direccion')} : ${orden.direccion}">
                </div>
                <div class="col-12">
                    <label class="form-label" for="notas">Notas</label>
                    <textarea class="form-control" id="notas" name="notas" rows="3" maxlength="1000"
                              th:text="${datos != null} ? ${datos.get('notas')} : ${orden.notas}"></textarea>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2 flex-wrap mb-4">
            <button type="submit" class="btn btn-primary px-4">Guardar cambios</button>
            <a th:href="@{/tienda-admin/ordenes(ver=${ver}, q=${q != null and q != '' ? q : null}, pagina=${pagina})}" class="btn btn-outline-secondary">Cancelar</a>
        </div>
    </form>
</div>
<script src="/js/tienda-admin/avisos.js"></script>
</body>
</html>
