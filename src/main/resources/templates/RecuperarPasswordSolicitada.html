<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#1a0f2e; color:#fff; display:flex; align-items:center; justify-content:center; min-height:100vh; font-family: sans-serif; padding: 20px; }
        .card-login { background:#2a1b42; padding:30px; border-radius:14px; width:360px; }
        .form-control { background:#1e1330; border:1px solid rgba(255,255,255,0.15); color:#fff; }
        .form-control:focus { background:#1e1330; color:#fff; border-color:#ec1561; box-shadow:0 0 0 0.2rem rgba(236,21,97,0.25); }
        .btn-primary { background: linear-gradient(135deg, #ec1561, #b81050); border: none; }
        .volver { color:#cbb8e0; font-size:0.85rem; text-decoration:none; }
        .volver:hover { color:#fff; }
        .alert-info { background: rgba(13,202,240,0.12); border:1px solid #0dcaf0; color:#9fe8f7; }
    </style>
</head>
<body>
    <div class="card-login">
        <a class="volver" href="/login">&larr; Volver al inicio de sesión</a>
        <h4 class="mt-3 mb-2">¿Olvidaste tu contraseña?</h4>
        <p class="mb-3" style="font-size:0.85rem; color:#cbb8e0;">
            Escribe tu usuario o tu correo registrado y te enviaremos un enlace para crear una nueva contraseña.
        </p>

        <div th:if="${mensaje}" class="alert alert-info" th:text="${mensaje}"></div>

        <form th:action="@{/recuperar-password}" method="post" th:if="${mensaje == null}">
            <div class="mb-3">
                <label class="form-label">Usuario o correo</label>
                <input type="text" name="usuarioOCorreo" class="form-control" required autofocus>
            </div>
            <button type="submit" class="btn btn-primary w-100">Enviar enlace de recuperación</button>
        </form>
    </div>
</body>
</html>
