<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Iniciar sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background:#1a0f2e; color:#fff; display:flex; align-items:center; justify-content:center; height:100vh; font-family: sans-serif; }
        .card-login { background:#2a1b42; padding:30px; border-radius:14px; width:320px; }
        .form-control { background:#1e1330; border:1px solid rgba(255,255,255,0.15); color:#fff; }
    </style>
</head>
<body>
    <div class="card-login">
        <h4 class="mb-3">Iniciar sesión</h4>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        <form th:action="@{/login-jwt}" method="post">
            <div class="mb-3">
                <label class="form-label">Usuario</label>
                <input type="text" name="username" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Entrar</button>
        </form>
    </div>
</body>
</html>
